spec:
  title: Code Graph not using in EASD
  problem: EASD skills (easd-specify, easd-plan, easd-implement, easd-review, easd-verify) run in Coding-only
    mode where the code_context tool is already injected as a deferred tool, yet the skill instructional
    files never reference it. This forces EASD agents to rely on basic read/grep/glob for source discovery,
    callers, callees, references, impact, and neighborhood traversal — missing the richer code graph navigation
    that the 9 Coding skills already leverage. The result is less accurate cross-repository code analysis
    during EASD specify/plan/implement/review/verify phases.
  outcome: All 5 EASD skill SKILL.md files gain explicit code_context usage guidance and the shared references/code-context-contract.md
    bundle, matching the pattern established by the 9 Coding skills. EASD agents can leverage code graph
    navigation (search, definition, callers, callees, references, impact, neighborhood) during specification
    grounding, planning, implementation, independent review, and verification — producing higher-fidelity
    source evidence and reducing the need for rereading raw files. The validation test is updated to reflect
    the expanded skill scope.
  goals:
  - Each EASD skill SKILL.md references code_context with phase-appropriate usage guidance
  - Each EASD skill bundles references/code-context-contract.md matching the Coding skills pattern
  - The validation test test_native_code_context_contract_is_embedded_in_coding_workflows expands to cover
    EASD skills
  - easd-specify uses code_context for repository discovery, ambiguity scanning, and source grounding
  - easd-plan uses code_context for impact target identification, affected-path mapping, and cross-layer
    dependency tracing
  - easd-implement uses code_context for caller/callee validation before and after edits, and for verifying
    symbol-level impact of changes
  - easd-review uses code_context for independent source verification of implementation claims, references
    checking, and transitive impact assessment
  - easd-verify uses code_context for evidence gate validation, cross-checking AC coverage against actual
    code symbols, and verifying documentation reconciliation
  non_goals:
  - Changing the code_context tool runtime, API, or schema
  - Modifying the deferred-tool catalog or tool injection mechanism
  - Altering EASD lifecycle state transitions, run states, or convergence rules
  - Adding new backend services or database changes
  - Changing the skill resolution or scope enforcement logic
  - Altering the Coding skills existing code_context patterns
  - Modifying the EASD knowledge-base index, specs, or features content
