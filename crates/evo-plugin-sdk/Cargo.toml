[package]
name = "evo-plugin-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/evo-plugin-sdk"
description = "Stable C ABI and optional provider development helpers for evo Rust-native plugins"
readme = "README.md"
keywords = ["agent", "llm", "ai", "plugin", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
# Core FFI types are zero-dep (std only). JSON round-trip helpers for
# `StableJsonValue` / `StableToolSchema.parameters` pull serde_json, gated behind
# the `json` feature (default on). A plugin that wants to avoid the dep can
# disable default features and do its own (de)serialization.
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }

# Provider authoring helpers are opt-in; the ABI core stays independent of evo-ai.
evo-ai = { workspace = true, optional = true, features = ["providers"] }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["json"]
json = ["dep:serde_json"]
# Compact, length-bounded binary payloads for high-frequency extension data.
# This is additive: JSON remains the default wire format and fallback.
binary = ["json", "dep:serde", "dep:ciborium"]
provider = ["json", "dep:evo-ai", "dep:tokio", "dep:serde", "dep:reqwest"]
process = ["dep:windows-sys", "dep:libc"]
stdio = ["dep:windows-sys", "dep:libc"]
