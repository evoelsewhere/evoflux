[package]
name = "evo-telemetry"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = "0.1.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/evo-telemetry"
description = "Telemetry span/event contracts (noop default), Rust port of evo-telemetry"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "telemetry"]
