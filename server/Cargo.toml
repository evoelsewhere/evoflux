[workspace]
resolver = "2"
members = ["crates/core", "crates/api-types", "crates/gateway", "crates/server"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"

# SQLite with BEGIN CONCURRENT (design §3.3); see vendor/SQLITE_BRANCH.toml.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
