[[unit]]
name = "terminal-processes"
owner = "python"
pin_breakers = ["adapter:terminal-processes"]
routes = ["/api/team/{session_id}/terminal/**", "/api/team/{session_id}/terminals/**", "/api/team/processes/**", "/api/team/preview/**", "/api/team/workspace/watch/**", "/api/team/{session_id}/files/watch/**"]
services = []

[[unit]]
name = "memory-search"
owner = "python"
pin_breakers = ["adapter:memory-search", "file-lock:wiki"]
routes = ["/api/wiki/**", "/api/team/workspace/search-everywhere/**", "/api/team/search-app/**"]
services = ["memory_backfill"]

[[unit]]
name = "documents-preview"
owner = "python"
pin_breakers = ["adapter:documents-preview"]
routes = ["/api/team/{session_id}/document-preview/**", "/api/team/{session_id}/office-preview/**", "/api/team/{session_id}/document-versions/**", "/api/team/{session_id}/motion-review/**", "/api/team/{session_id}/media/**", "/api/team/office-runtime/**"]
