pin_breakers = ["adapter:git-coding", "file-lock:git-repo"]
routes = ["/api/team/workspace/git/**", "/api/team/workspace/worktrees/**", "/api/team/reviews/**", "/api/team/projects/**", "/api/team/workspace/change-sets/**", "/api/team/workspace/problems/**", "/api/team/workspace/editor/**"]
