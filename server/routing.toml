[[unit]]
name = "workspace-files"
owner = "python"
pin_breakers = ["adapter:workspace-files", "file-lock:snapshot"]
routes = ["/api/team/workspace/files/**", "/api/team/workspace/status/**", "/api/team/workspace/git-diff/**", "/api/team/workspace/lsp/**", "/api/team/workspace/language-servers/**", "/api/team/workspace/browse/**", "/api/team/workspace/tree/**", "/api/team/workspace/validate/**", "/api/team/{session_id}/files/**", "/api/team/{session_id}/workspace/**", "/api/team/{session_id}/uploads/**"]
services = []

[[unit]]
name = "webbridge-browser"
owner = "python"
pin_breakers = ["adapter:webbridge-browser"]
routes = ["/api/team/webbridge/**", "/api/team/browser/**", "/api/team/{session_id}/browser/**", "/api/team/{session_id}/computer/**", "/api/settings/webbridge/**", "/api/settings/computer-app/**"]
