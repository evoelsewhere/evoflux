[[unit]]
name = "conductor"
owner = "python"
pin_breakers = ["adapter:conductor"]
routes = ["/api/settings/conductor/**"]
services = ["conductor"]

[[unit]]
name = "health-diagnostics"
owner = "python"
pin_breakers = ["adapter:health-diagnostics"]
routes = ["/api/health/**", "/api/diagnostics/**"]
services = []

[[unit]]
name = "agent-runtime"
owner = "python"
routes = ["/api/team/workspace/git/ai/**", "/api/team/webbridge/sessions/**", "/api/team/webbridge/interactions/**", "/api/scheduler/**", "/api/dream/**", "/api/team/chat/**", "/api/team/leads/**", "/api/team/agents/**", "/api/team/commands/**", "/api/team/sessions/**", "/api/team/session-folders/**", "/api/team/suggested-tasks/**", "/api/team/{session_id}/history/**", "/api/team/{session_id}/side-chat/**", "/api/team/{session_id}/stream/**", "/api/team/{session_id}/goal/**", "/api/team/{session_id}/permissions/**", "/api/team/{session_id}/questions/**", "/api/team/**"]
