[package]
name = "evoflux-net"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "gzip", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
thiserror = "2"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
