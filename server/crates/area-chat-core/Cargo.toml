[package]
name = "evoflux-area-chat-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
evoflux-area-providers = { path = "../area-providers" }
evoflux-area-tools = { path = "../area-tools" }
evoflux-core = { path = "../core" }
evoflux-net = { path = "../net" }
fastrand = "2"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
