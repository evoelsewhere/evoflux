[package]
name = "evoflux-area-quote"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
evoflux-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "test-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
