[package]
name = "evoflux-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
fastrand = "2"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
