[package]
name = "evoflux-area-observability"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
evoflux-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "test-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
