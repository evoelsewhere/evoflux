[package]
name = "evoflux-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[[bin]]
# Test harness only (contract tests, supervisor tests); evoflux-server is the product binary (Task 11).
name = "evoflux-gateway-harness"
path = "src/bin/harness.rs"
test = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-reverse-proxy = { version = "2.2", default-features = false }
bytes = "1"
evoflux-core = { path = "../core" }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
percent-encoding = "2"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "process-group", "creation-flags", "kill-on-drop"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time", "fs"] }
toml = "0.9"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Same version as process-wrap's, for its CreationFlags wrapper.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
