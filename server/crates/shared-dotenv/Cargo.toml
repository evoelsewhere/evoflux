[package]
name = "evoflux-shared-dotenv"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
indexmap = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
