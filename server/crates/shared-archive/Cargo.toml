[package]
name = "evoflux-shared-archive"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "shared_archive"

[lints]
workspace = true

[dependencies]
cap-std = "4"
cap-fs-ext = "4"
caseless = "0.2.2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
# Iterable parsing is currently an unstable API and requires an exact version.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
