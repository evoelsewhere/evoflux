[package]
name = "evoflux-area-providers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
evoflux-core = { path = "../core" }
evoflux-net = { path = "../net" }
fastrand = "2"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time", "test-util"] }
