[package]
name = "evoflux-shared-provider-catalog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Port of the Python provider registry and settings provider catalog, with bundled models.dev data"

[lints]
workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
