[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoflux"
version = "2.0.8"  # keep in sync with app/version.txt
description = "Self-hosted AI agents — streaming chat, tool use, persistent memory, multi-agent teams"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "EvoFlux contributors"}]
keywords = ["ai", "agents", "llm", "fastapi", "self-hosted", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.22",
    # SQLAlchemy's asyncio bridge requires greenlet at runtime. Declare it
    # directly because SQLAlchemy's platform marker misses Darwin ``arm64``,
    # which otherwise produces a sidecar that cannot run Alembic migrations.
    "greenlet>=3.1.1",
    "loguru>=0.7.0",
    # Native OS credential vault for Conductor connection tokens.
    "keyring>=25.6.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "ddgs>=9.12.0",
    # Backport of uuid.uuid7(), which only lands in the stdlib `uuid` module
    # in Python 3.14. Shimmed onto `uuid` in app/__init__.py for 3.12/3.13.
    "uuid7>=0.1.0",
    # Core PDF/HTML intake (app/services/document_text.py): PDFium for PDF
    # text, BeautifulSoup + markdownify for HTML. Office files are view-only
    # and are never converted into agent context.
    "pypdfium2>=5.7.0",
    "beautifulsoup4>=4.14.3",
    "markdownify>=1.2.2",
    "markdown-it-py>=4.0.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    # The desktop browser, terminal, and WebBridge surfaces use FastAPI
    # WebSockets. Uvicorn core only ships HTTP support, so the transport must
    # be an explicit runtime dependency of the packaged sidecar.
    "websockets>=15.0.1",
    "sse-starlette>=3.3.4",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "python-multipart>=0.0.31",
    "prometheus-client>=0.21.0",
    "croniter>=6.2.2",
    # Windows does not ship an IANA timezone database. zoneinfo falls back to
    # this package so Scheduler validation accepts browser-reported zones in
    # the bundled desktop sidecar as well as on Unix hosts.
    "tzdata>=2025.2",
    # MCP 2.x uses the native Streamable HTTP transport and httpx2 client.
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
    "boto3>=1.35.0",
    "duckdb>=1.1.0",
    "truststore>=0.10.4",
    # Filesystem watcher (Rust notify backend) for workspace event streams.
    "watchfiles>=0.24.0",
    # ConPTY backend for the interactive terminal on Windows (POSIX uses the
    # stdlib pty/fcntl/termios stack). Imported lazily by terminal_service.
    "pywinpty>=2.0.14; sys_platform == 'win32'",
    "cryptography>=44",
]

[project.urls]
Repository = "https://github.com/evoelsewhere/evoflux"
"Bug Tracker" = "https://github.com/evoelsewhere/evoflux/issues"

[project.scripts]
evoflux = "app.cli:main"

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-randomly>=4.1.0",
    "respx>=0.22.0",
    "ruff>=0.15.8",
    "tiktoken>=0.12.0",
    "ty>=0.0.33,<0.1",
    # Exercise the host-owned, read-only Office/PDF viewer in source checkouts
    # without making its format engines part of the slim server surface.
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Include non-Python data files inside the package: Alembic resources and the
# seed bundle (mapped to app/_seed/). The web UI is packaged by the desktop
# shell, not embedded in the FastAPI server wheel.
[tool.hatch.build.targets.wheel.force-include]
"app/alembic.ini" = "app/alembic.ini"
"seed" = "app/_seed"

[project.optional-dependencies]
# Runtime dependencies for the host-owned, read-only workspace viewer. Desktop
# packages install this extra; slim/API-only installs can omit Office
# rendering without importing those libraries at process startup. PDF
# rendering uses pypdfium2, which is a core dependency.
office-preview = [
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = true

[tool.ty.src]
include = ["app"]
exclude = ["tests", "**/__pycache__", ".venv"]

[tool.ruff]
target-version = "py313"
# Skill evaluation scenarios are data: their toy programs are deliberately
# imperfect inputs for the Skill under test.
extend-exclude = ["tests/fixtures/skill-evals"]

[tool.ruff.lint.per-file-ignores]
# Imports after truststore.inject_into_ssl() / apply_ssl_patch() are intentional.
"app/cli/main.py" = ["E402"]
"app/server.py" = ["E402"]
