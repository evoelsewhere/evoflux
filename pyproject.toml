[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoflux"
version = "0.0.2"  # keep in sync with app/version.txt
description = "Self-hosted AI agents — streaming chat, tool use, persistent memory, multi-agent teams"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "EvoFlux contributors"}]
keywords = ["ai", "agents", "llm", "fastapi", "self-hosted", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.22",
    "google-genai>=0.4.0",
    "jinja2>=3.1.3",
    "loguru>=0.7.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "greenlet>=3.3.2",
    "rich>=14.3.3",
    "prompt-toolkit>=3.0.52",
    "ddgs>=9.12.0",
    # Backport of uuid.uuid7(), which only lands in the stdlib `uuid` module
    # in Python 3.14. Shimmed onto `uuid` in app/__init__.py for 3.12/3.13.
    "uuid7>=0.1.0",
    # Document conversion ships with only the formats used by the slim sidecar:
    # PDF and DOCX via extras, plus HTML through markitdown core. Heavier
    # features stay behind optional extras to keep the desktop bundle small.
    "markitdown[pdf,docx]>=0.1.5",
    "markdown-it-py>=4.0.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "sse-starlette>=3.3.4",
    "websockets>=15.0.1",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "python-multipart>=0.0.31",
    "prometheus-client>=0.21.0",
    "python-magic>=0.4.27",
    "croniter>=6.2.2",
    "mcp>=1.28.1",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.1",
    "duckdb>=1.1.0",
    "truststore>=0.10.4",
    "browser-use>=0.11.13",
    # Code knowledge graph: tree-sitter parsing. The language pack bundles
    # 160+ grammars behind the stable ABI, so new languages are added without
    # extra wheels.
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=0.10.0",
    # Filesystem watcher (Rust notify backend) for auto-reindexing the code
    # graph when source files change. Opt-in via code_graph.watch_enabled.
    "watchfiles>=0.24.0",
    # ConPTY backend for the interactive terminal on Windows (POSIX uses the
    # stdlib pty/fcntl/termios stack). Imported lazily by terminal_service.
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/khuonghung/evoflux"
"Bug Tracker" = "https://github.com/khuonghung/evoflux/issues"

[project.scripts]
evoflux = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-randomly>=4.1.0",
    "respx>=0.22.0",
    "ruff>=0.15.8",
    "tiktoken>=0.12.0",
    "ty>=0.0.33,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Include non-Python data files inside the package: Alembic resources and the
# seed bundle (mapped to app/_seed/). The AIM KB seed includes a safe project
# rulebook template. The web UI is packaged by the desktop shell, not embedded
# in the FastAPI server wheel.
[tool.hatch.build.targets.wheel.force-include]
"app/alembic.ini" = "app/alembic.ini"
"seed" = "app/_seed"

[project.optional-dependencies]
# Azure Document Intelligence routing in markitdown — server-side OCR fallback.
# Brings in the azure-ai-* SDK family. Adds ~30 MB.
azure-doc-intel = ["markitdown[az-doc-intel]>=0.1.5"]

# Convenience: everything-but-the-kitchen-sink. Used by
# ``uv tool install evoflux[full]`` for users who don't care about size.
full = ["evoflux[azure-doc-intel]"]

[tool.uv]
package = true
# onnxruntime dropped macOS x86_64 (Intel) wheels starting with 1.24; magika
# (pulled in transitively by markitdown for MIME sniffing) puts no upper
# bound on onnxruntime, so the resolver otherwise picks a version with no
# installable artifact for Intel Macs. Pin to the last version with a
# macosx x86_64 wheel.
constraint-dependencies = ["onnxruntime<1.24"]

[tool.ty.src]
include = ["app"]
exclude = ["tests", "**/__pycache__", ".venv"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# Imports after truststore.inject_into_ssl() / apply_ssl_patch() are intentional.
"app/cli/main.py" = ["E402"]
"app/server.py" = ["E402"]
"scripts/download_embedding_model.py" = ["E402"]
