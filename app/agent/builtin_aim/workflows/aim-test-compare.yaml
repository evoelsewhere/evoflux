# AIM pipeline — the differentiator: deterministic equivalence compare.
# The official verdict is the aim_compare TOOL node (§3.8(b)/(d)), not an
# agent's prose: the agent only produces the target's actual output, then a
# deterministic node compares it and a switch routes on that verdict. A human
# can only certify a unit the compare already PASSED; a fail/error routes
# straight to triage. The repair loop lives inside the triage/convert agents'
# own turns — v1 forbids graph cycles.
schema_version: 1
name: aim-test-compare
description: Run one target unit against trusted golden output, then certify or triage
scope: aim

inputs:
  - name: unit
    type: string
    required: true
    description: "module/UNIT to compare"
  - name: case_set
    type: enum
    options: [smoke, full]
    default: smoke
    description: "golden case set to run"

nodes:
  - id: readiness
    kind: tool
    tool: aim_readiness
    args:
      pipeline: aim-test-compare
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"

  - id: readiness_branch
    kind: switch
    value: "{{nodes.readiness.output.status}}"

  - id: blocked
    kind: notify
    title: "aim-test-compare blocked"
    message: "{{inputs.unit}} cannot be compared: {{nodes.readiness.output.blockers | json}}"

  - id: acquire
    kind: tool
    tool: aim_claim
    args: { action: acquire, unit: "{{inputs.unit}}" }

  - id: claim_branch
    kind: switch
    value: "{{nodes.acquire.output.status}}"

  - id: claim_blocked
    kind: notify
    title: "aim-test-compare claim blocked"
    message: "{{inputs.unit}} is already owned: {{nodes.acquire.output.blockers | json}}"

  - id: run
    kind: tool
    tool: aim_execute
    args:
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"
    timeout_s: 3600

  - id: compare
    kind: tool
    tool: aim_compare
    args:
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"

  - id: verdict
    kind: switch
    value: "{{nodes.compare.output.verdict}}"

  - id: certify
    kind: gate
    title: "Certify {{inputs.unit}} as equivalent?"
    body: "Deterministic compare PASSED for {{inputs.unit}} ({{nodes.compare.output.diff_count}} diff(s)). Report: {{nodes.compare.output.report_path}}. Certifying marks the unit equivalent."
    choices: [certify, hold]

  - id: mark_equivalent
    kind: tool
    tool: aim_units
    args:
      action: set_phase
      unit: "{{inputs.unit}}"
      phase: equivalent

  - id: triage
    kind: agent
    subagents: [aim-triage-analyst]
    prompt: |
      The deterministic compare for {{inputs.unit}} did NOT pass
      (verdict={{nodes.compare.output.verdict}},
      {{nodes.compare.output.diff_count}} diff cluster(s); report at
      {{nodes.compare.output.report_path}}). Delegate to `aim-triage-analyst`:
      follow the aim-diff-triage skill — classify each difference (target bug /
      legacy quirk / accepted difference / harness artifact), cite business
      rules, and propose the next fix or an ADR for accepted differences.
      aim_compare already recorded this attempt; do not create a duplicate run.
      If report_path is null, triage the reported harness/configuration error.
    timeout_s: 1800

  - id: done
    kind: notify
    title: "aim-test-compare"
    message: "{{inputs.unit}} compare finished (verdict {{nodes.compare.output.verdict}}) — see Runs & Reports."

  - id: release
    kind: tool
    tool: aim_claim
    args: { action: release, unit: "{{inputs.unit}}" }

edges:
  - { from: readiness, to: readiness_branch }
  - { from: readiness_branch, to: blocked, when: blocked }
  - { from: readiness_branch, to: acquire, when: ready }
  - { from: acquire, to: claim_branch }
  - { from: claim_branch, to: claim_blocked, when: blocked }
  - { from: claim_branch, to: run, when: acquired }
  - { from: run, to: compare }
  - { from: compare, to: verdict }
  - { from: verdict, to: certify, when: pass }
  - { from: verdict, to: triage, when: "*" }
  - { from: certify, to: mark_equivalent, when: certify }
  - { from: certify, to: release, when: hold }
  - { from: mark_equivalent, to: release }
  - { from: triage, to: release }
  - { from: release, to: done }

outputs:
  readiness_status: "{{nodes.readiness.output.status}}"
  blockers: "{{nodes.readiness.output.blockers | json}}"
  verdict: "{{nodes.compare.output.verdict}}"
  report_path: "{{nodes.compare.output.report_path}}"
  decision: "{{nodes.certify.output.choice}}"
