# AIM pipeline — the differentiator: deterministic equivalence compare
# with a human certification gate and a triage branch. The repair loop
# lives inside the triage/convert agents\' own turns — Phase 1 forbids
# graph cycles.
schema_version: 1
name: aim-test-compare
description: Run legacy vs target for one unit, compare canonically, certify or triage
scope: aim

inputs:
  - name: unit
    type: string
    required: true
    description: "module/UNIT to compare"
  - name: case_set
    type: enum
    options: [smoke, full]
    default: smoke
    description: "golden case set to run"

nodes:
  - id: compare
    kind: agent
    subagents: [aim-test-engineer]
    prompt: |
      Run the TEST-COMPARE phase for unit {{inputs.unit}} with the
      '{{inputs.case_set}}' golden case set. Delegate to `aim-test-engineer`:
      execute the legacy and target runners from the rulebook for each golden
      case, canonicalize both outputs, then diff with the aim_compare tool
      (which records the AimRun). Report the verdict with the diff summary.
    timeout_s: 3600

  - id: certify
    kind: gate
    title: "Certify {{inputs.unit}} as equivalent?"
    body: "{{nodes.compare.output.text | truncate:2000}}"
    choices: [certify, triage]

  - id: mark_equivalent
    kind: agent
    subagents: []
    prompt: |
      The compare result for {{inputs.unit}} is certified. Set the unit phase
      to equivalent via aim_units, citing the latest compare run.

  - id: triage
    kind: agent
    subagents: [aim-triage-analyst]
    prompt: |
      The compare result for {{inputs.unit}} needs triage. Delegate to
      `aim-triage-analyst`: follow the aim-diff-triage skill — classify each
      difference (target bug / legacy quirk / accepted difference / harness
      artifact), cite business rules, and propose the next fix or an ADR for
      accepted differences.
    timeout_s: 1800

  - id: done
    kind: notify
    title: "aim-test-compare"
    message: "{{inputs.unit}} compare finished — see Runs & Reports."

edges:
  - { from: compare, to: certify }
  - { from: certify, to: mark_equivalent, when: certify }
  - { from: certify, to: triage, when: triage }
  - { from: mark_equivalent, to: done }
  - { from: triage, to: done }

outputs:
  verdict: "{{nodes.compare.output.text}}"
