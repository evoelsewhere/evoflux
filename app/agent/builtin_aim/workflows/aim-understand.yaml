# AIM pipeline — understand one unit into the KB (comprehension phase).
schema_version: 1
name: aim-understand
description: Reverse-engineer one unit into the KB (doc + candidate business rules)
scope: aim

inputs:
  - name: unit
    type: string
    required: true
    description: "module/UNIT to document (e.g. core-batch/EODCLOSE)"

nodes:
  - id: understand
    kind: agent
    subagents: [aim-archaeologist]
    prompt: |
      Run the UNDERSTAND-UNIT phase for unit {{inputs.unit}}. Delegate to
      `aim-archaeologist`: follow the aim-legacy-comprehension skill —
      bottom-up, dependencies' docs first (if a dependency has no doc yet,
      document it first) — then write the unit doc into the KB, extract
      candidate business rules (aim-business-rule-extraction), and set the
      unit phase to understood via aim_units.
    timeout_s: 1800

  - id: done
    kind: notify
    title: "aim-understand"
    message: "{{inputs.unit}} documented — doc and candidate rules are in the KB."

edges:
  - { from: understand, to: done }

outputs:
  summary: "{{nodes.understand.output.text}}"
