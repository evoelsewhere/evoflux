# AIM pipeline — assess: inventory the estate, propose waves, human gate.
# Conforms to workflow schema v1 (documents/plans/workflows-feature-plan.md §4.2).
schema_version: 1
name: aim-assess
description: Index the source estate, build the unit inventory in the KB, and propose waves
scope: aim

nodes:
  - id: assess
    kind: agent
    subagents: [aim-appraiser]
    prompt: |
      Run the ASSESS phase for this AIM project. Delegate to `aim-appraiser`:
      refresh the repository-local code index, build the unit inventory into the
      KB repo (modules/<module>/<unit>.md stubs with frontmatter
      phase=inventory plus inventory/units.md), score complexity, and propose
      waves bottom-up (shared leaves = wave 0). Record every unit via the
      aim_units tool. Finish with a wave-plan summary.
    timeout_s: 1800

  - id: approve_plan
    kind: gate
    title: "Approve the wave plan"
    body: "{{nodes.assess.output.text | truncate:2000}}"
    choices: [approve, rework]

  - id: rework
    kind: agent
    subagents: [aim-appraiser]
    prompt: |
      The wave plan was NOT approved. Revisit the inventory and wave
      assignments with `aim-appraiser`, addressing likely objections
      (oversized waves, missed shared dependencies), update the KB and
      aim_units, and produce a revised summary.
    timeout_s: 1800

  - id: approve_rework
    kind: gate
    title: "Approve the revised wave plan"
    body: "{{nodes.rework.output.text | truncate:2000}}"
    choices: [approve, stop]

  - id: rework_stopped
    kind: notify
    title: "aim-assess"
    message: "The revised wave plan was not approved. Project phase remains assess."

  - id: advance_phase
    kind: tool
    tool: aim_units
    args:
      action: set_project_phase
      phase: understand

  - id: suggest_next
    kind: gate
    title: "Generate a suggested workflow?"
    body: "Build a dependency-aware board of what to run now, what comes next, and what needs operator input. It can also be generated later from Overview."
    choices: [generate, skip]

  - id: generate_suggestions
    kind: tool
    tool: aim_suggestions
    args: { action: generate }

  - id: suggestions_ready
    kind: notify
    title: "aim-assess"
    message: "Inventory, wave plan, and suggested next actions are ready on Overview."

  - id: done
    kind: notify
    title: "aim-assess"
    message: "Inventory and wave plan are in the KB. Suggested next actions were skipped and can be generated later from Overview."

edges:
  - { from: assess, to: approve_plan }
  - { from: approve_plan, to: advance_phase, when: approve }
  - { from: approve_plan, to: rework, when: rework }
  - { from: advance_phase, to: suggest_next }
  - { from: suggest_next, to: generate_suggestions, when: generate }
  - { from: suggest_next, to: done, when: skip }
  - { from: generate_suggestions, to: suggestions_ready }
  - { from: rework, to: approve_rework }
  - { from: approve_rework, to: advance_phase, when: approve }
  - { from: approve_rework, to: rework_stopped, when: stop }

outputs:
  summary: "{{nodes.assess.output.text}}"
  original_summary: "{{nodes.assess.output.text}}"
  initial_decision: "{{nodes.approve_plan.output.choice}}"
  revised_summary: "{{nodes.rework.output.text}}"
  revised_decision: "{{nodes.approve_rework.output.choice}}"
  suggestion_decision: "{{nodes.suggest_next.output.choice}}"
  suggestion_plan_path: "{{nodes.generate_suggestions.output.plan_path}}"
