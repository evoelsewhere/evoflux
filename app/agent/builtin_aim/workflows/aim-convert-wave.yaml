# AIM pipeline — convert every designed unit in one wave, gated up front.
# The unit list comes from a direct aim_units tool call (format: json), so
# the foreach iterates deterministic data — not an agent's prose.
schema_version: 1
name: aim-convert-wave
description: Convert a wave's designed units sequentially in dependency order
scope: aim

inputs:
  - name: wave
    type: number
    required: true
    description: "wave number to convert"

nodes:
  - id: readiness
    kind: tool
    tool: aim_readiness
    args:
      pipeline: aim-convert-wave
      wave: "{{inputs.wave}}"

  - id: readiness_branch
    kind: switch
    value: "{{nodes.readiness.output.status}}"

  - id: blocked
    kind: notify
    title: "aim-convert-wave blocked"
    message: "Wave {{inputs.wave}} is not ready for conversion: {{nodes.readiness.output.blockers | json}}"

  - id: approve_batch
    kind: gate
    title: "Convert wave {{inputs.wave}}?"
    body: "{{nodes.readiness.output.selected_count}} designed unit(s) will be implemented in dependency order: {{nodes.readiness.output.selected_units | truncate:1500}}"
    choices: [approve, cancel]

  - id: cancelled
    kind: notify
    title: "aim-convert-wave"
    message: "Wave {{inputs.wave}} conversion was cancelled before claims were acquired."

  - id: acquire
    kind: tool
    tool: aim_claim
    args:
      action: acquire
      units: "{{nodes.readiness.output.selected_units}}"

  - id: claim_branch
    kind: switch
    value: "{{nodes.acquire.output.status}}"

  - id: claim_blocked
    kind: notify
    title: "aim-convert-wave claim blocked"
    message: "Wave {{inputs.wave}} has claimed units: {{nodes.acquire.output.blockers | json}}"

  - id: revalidate
    kind: tool
    tool: aim_readiness
    args:
      pipeline: aim-convert-wave
      wave: "{{inputs.wave}}"
      expected_units: "{{nodes.readiness.output.selected_units}}"

  - id: revalidate_branch
    kind: switch
    value: "{{nodes.revalidate.output.status}}"

  - id: release_stale
    kind: tool
    tool: aim_claim
    args:
      action: release
      units: "{{nodes.readiness.output.selected_units}}"

  - id: stale
    kind: notify
    title: "aim-convert-wave selection changed"
    message: "Wave {{inputs.wave}} changed after approval: {{nodes.revalidate.output.blockers | json}}"

  - id: convert_each
    kind: foreach
    items: "{{nodes.readiness.output.selected_units}}"
    body:
      kind: agent
      subagents: [aim-converter]
      prompt: |
        Convert unit {{item}} (wave {{inputs.wave}},
        item {{index}}): delegate to `aim-converter` — implement it in the
        target repo per its KB mapping and target-conventions (base source is
        read-only), verify the target builds, then update target_paths via
        aim_units WITHOUT changing phase. The deterministic mark_converted
        node owns the transition after every implementation finishes. Commit
        that unit's target-repo changes before returning.
      timeout_s: 3600

  - id: mark_converted
    kind: foreach
    items: "{{nodes.readiness.output.selected_units}}"
    body:
      kind: tool
      tool: aim_units
      args:
        action: set_phase
        unit: "{{item}}"
        phase: converted

  - id: verify_each
    kind: foreach
    items: "{{nodes.readiness.output.selected_units}}"
    body:
      kind: tool
      tool: aim_verify
      args:
        unit: "{{item}}"
      timeout_s: 1800

  - id: done
    kind: notify
    title: "aim-convert-wave"
    message: "Wave {{inputs.wave}}: {{nodes.convert_each.output.count}} unit(s) converted — run aim-test-compare per unit next."

  - id: release
    kind: tool
    tool: aim_claim
    args:
      action: release
      units: "{{nodes.readiness.output.selected_units}}"

edges:
  - { from: readiness, to: readiness_branch }
  - { from: readiness_branch, to: blocked, when: blocked }
  - { from: readiness_branch, to: approve_batch, when: ready }
  - { from: approve_batch, to: acquire, when: approve }
  - { from: approve_batch, to: cancelled, when: cancel }
  - { from: acquire, to: claim_branch }
  - { from: claim_branch, to: claim_blocked, when: blocked }
  - { from: claim_branch, to: revalidate, when: acquired }
  - { from: revalidate, to: revalidate_branch }
  - { from: revalidate_branch, to: convert_each, when: ready }
  - { from: revalidate_branch, to: release_stale, when: blocked }
  - { from: release_stale, to: stale }
  - { from: convert_each, to: verify_each }
  - { from: verify_each, to: mark_converted }
  - { from: mark_converted, to: release }
  - { from: release, to: done }

outputs:
  readiness_status: "{{nodes.readiness.output.status}}"
  blockers: "{{nodes.readiness.output.blockers | json}}"
  selected_units: "{{nodes.readiness.output.selected_units}}"
  decision: "{{nodes.approve_batch.output.choice}}"
  verified_count: "{{nodes.verify_each.output.count}}"
  converted_count: "{{nodes.mark_converted.output.count}}"
