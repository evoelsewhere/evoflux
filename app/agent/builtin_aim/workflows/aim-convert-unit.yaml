# AIM pipeline — convert one unit into the target repo, gated before writes.
# Phase transitions are DETERMINISTIC tool nodes (designed after the plan is
# approved, converted after implementation), not prompt instructions the
# agent might forget — the wave pipeline selects on phase=designed.
schema_version: 1
name: aim-convert-unit
description: Plan, approve, then implement one unit in the target repo
scope: aim

inputs:
  - name: unit
    type: string
    required: true
    description: "module/UNIT to convert"

nodes:
  - id: plan
    kind: agent
    subagents: [aim-target-architect]
    prompt: |
      Prepare the conversion plan for unit {{inputs.unit}}: read its KB doc
      and business rules, consult the rulebook mappings and
      target-conventions.md, and produce mapping/<unit>.md in the KB — the
      target design this unit will be implemented against. Do NOT write any
      code in the target repo yet, and do NOT change the unit's phase — the
      pipeline marks it deterministically after you finish.
    timeout_s: 1800

  - id: approve
    kind: gate
    title: "Approve conversion plan for {{inputs.unit}}"
    body: "{{nodes.plan.output.text | truncate:2000}}"
    choices: [approve, reject]

  - id: mark_designed
    kind: tool
    tool: aim_units
    args:
      action: set_phase
      unit: "{{inputs.unit}}"
      phase: designed

  - id: convert
    kind: agent
    subagents: [aim-converter]
    prompt: |
      The plan for {{inputs.unit}} is approved. Delegate to `aim-converter`:
      implement it in the target repo per mapping/<unit>.md and
      target-conventions (the base source stays read-only), then verify the
      target builds/tests. Do NOT change the unit's phase — the pipeline marks
      it converted deterministically after you finish.
    timeout_s: 3600

  - id: mark_converted
    kind: tool
    tool: aim_units
    args:
      action: set_phase
      unit: "{{inputs.unit}}"
      phase: converted

  - id: done
    kind: notify
    title: "aim-convert-unit"
    message: "{{inputs.unit}} converted — run aim-test-compare next."

edges:
  - { from: plan, to: approve }
  - { from: approve, to: mark_designed, when: approve }
  - { from: mark_designed, to: convert }
  - { from: convert, to: mark_converted }
  - { from: mark_converted, to: done }

outputs:
  plan: "{{nodes.plan.output.text}}"
  result: "{{nodes.convert.output.text}}"
