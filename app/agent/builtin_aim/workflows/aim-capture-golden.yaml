# AIM pipeline - capture a trusted legacy baseline with human approval.
schema_version: 1
name: aim-capture-golden
description: Prepare, validate, and capture one legacy case set into trusted expected output
scope: aim

inputs:
  - name: unit
    type: string
    required: true
    description: "module/unit whose legacy behavior is being captured"
  - name: case_set
    type: enum
    options: [smoke, full]
    default: smoke
    description: "golden case set name"
  - name: overwrite
    type: boolean
    default: false
    description: "replace an existing baseline after explicit approval"

nodes:
  - id: readiness
    kind: tool
    tool: aim_readiness
    args:
      pipeline: aim-capture-golden
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"
      overwrite: "{{inputs.overwrite}}"

  - id: readiness_branch
    kind: switch
    value: "{{nodes.readiness.output.status}}"

  - id: blocked
    kind: notify
    title: "aim-capture-golden blocked"
    message: "{{inputs.unit}} cannot be captured: {{nodes.readiness.output.blockers | json}}"

  - id: acquire
    kind: tool
    tool: aim_claim
    args: { action: acquire, unit: "{{inputs.unit}}" }

  - id: claim_branch
    kind: switch
    value: "{{nodes.acquire.output.status}}"

  - id: claim_blocked
    kind: notify
    title: "aim-capture-golden claim blocked"
    message: "{{inputs.unit}} is already owned: {{nodes.acquire.output.blockers | json}}"

  - id: prepare
    kind: agent
    subagents: [aim-test-engineer]
    prompt: |
      Prepare {{inputs.unit}} case {{inputs.case_set}} for legacy capture. Read
      the unit documentation, confirmed rules, mapping when available, and the
      active rulebook runner contract. Create or validate the case directory,
      input/ fixtures, meta.yaml, legacy.command, and target.command. Commands
      must be deterministic, write only to AIM_OUT_DIR, and never edit expected/.
      For captured provenance, meta.yaml must name canonicalizer_profile, the
      clean source_revision, environment_fingerprint, and capture_command.
      Do not synthesize expected output. Summarize exactly what will execute,
      provenance, coverage, overwrite intent, and any trust concerns.
    timeout_s: 900

  - id: validate_contract
    kind: tool
    tool: aim_readiness
    args:
      pipeline: aim-capture-golden-contract
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"
      overwrite: "{{inputs.overwrite}}"

  - id: contract_branch
    kind: switch
    value: "{{nodes.validate_contract.output.status}}"

  - id: contract_blocked
    kind: notify
    title: "aim-capture-golden contract blocked"
    message: "{{inputs.unit}} case {{inputs.case_set}} is incomplete: {{nodes.validate_contract.output.blockers | json}}"

  - id: release_contract_blocked
    kind: tool
    tool: aim_claim
    args: { action: release, unit: "{{inputs.unit}}" }

  - id: approve
    kind: gate
    title: "Capture legacy baseline for {{inputs.unit}}?"
    body: "Overwrite existing baseline: {{inputs.overwrite}}. {{nodes.prepare.output.text | truncate:2000}}"
    choices: [capture, hold]

  - id: capture
    kind: tool
    tool: aim_capture
    args:
      unit: "{{inputs.unit}}"
      case_set: "{{inputs.case_set}}"
      overwrite: "{{inputs.overwrite}}"
    timeout_s: 3600

  - id: release_success
    kind: tool
    tool: aim_claim
    args: { action: release, unit: "{{inputs.unit}}" }

  - id: release_hold
    kind: tool
    tool: aim_claim
    args: { action: release, unit: "{{inputs.unit}}" }

  - id: held
    kind: notify
    title: "aim-capture-golden"
    message: "Legacy baseline capture for {{inputs.unit}}/{{inputs.case_set}} was held; expected output was not changed."

  - id: done
    kind: notify
    title: "aim-capture-golden"
    message: "Legacy baseline capture finished for {{inputs.unit}}/{{inputs.case_set}}."

edges:
  - { from: readiness, to: readiness_branch }
  - { from: readiness_branch, to: blocked, when: blocked }
  - { from: readiness_branch, to: acquire, when: ready }
  - { from: acquire, to: claim_branch }
  - { from: claim_branch, to: claim_blocked, when: blocked }
  - { from: claim_branch, to: prepare, when: acquired }
  - { from: prepare, to: validate_contract }
  - { from: validate_contract, to: contract_branch }
  - { from: contract_branch, to: approve, when: ready }
  - { from: contract_branch, to: release_contract_blocked, when: blocked }
  - { from: release_contract_blocked, to: contract_blocked }
  - { from: approve, to: capture, when: capture }
  - { from: approve, to: release_hold, when: hold }
  - { from: capture, to: release_success }
  - { from: release_success, to: done }
  - { from: release_hold, to: held }

outputs:
  readiness_status: "{{nodes.readiness.output.status}}"
  blockers: "{{nodes.readiness.output.blockers | json}}"
  contract_status: "{{nodes.validate_contract.output.status}}"
  decision: "{{nodes.approve.output.choice}}"
  expected_dir: "{{nodes.capture.output.expected_dir}}"