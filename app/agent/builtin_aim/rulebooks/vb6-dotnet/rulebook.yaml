# AIM rulebook manifest — vb6-dotnet
# Schema per documents/research/aim-framework.md §3.7 in the EvoFlux repo.
# Status: content-only (AIM-0). This is the deliberate proving ground for
# (a) the structural fallback parser (AIM-2/3 — VB6 has no usable
# tree-sitter grammar) and (b) the §3.13A UI/UX rules (VB6 estates are
# screen-heavy).

id: vb6-dotnet
version: "0.1"
description: >
  Migrate a VB6 (forms, modules, class modules) application to modern
  .NET. Cross-language, cross-paradigm (event-driven forms + global
  mutable state → structured DI-based services), and almost always
  screen-heavy — exercises the hardest parts of the framework on purpose.

source:
  stack: vb6
  file_extensions: [".frm", ".bas", ".cls", ".ctl"]
target:
  stack: dotnet8
  file_extensions: [".cs"]

unit_kinds: [form, module, class, report]

parser_strategy: structural   # no usable tree-sitter grammar for VB6 —
                                # see extractors/vb6-structural.yaml, which
                                # is the config the (not-yet-built)
                                # parsers/structural.py will consume.

compare_default_profile: default

overlays:
  agents:
    - aim-converter          # + vb6-dotnet-idioms skill
    - aim-target-architect   # + note on UI-pattern-first design for this pack
  skills:
    - vb6-dotnet-idioms

runners:
  legacy: runners/run_legacy.ps1
  target: runners/run_target.sh

ui_patterns: ui-patterns/vb6-to-dotnet-ui-patterns.md   # mandatory for this
                                                          # pack per §3.13A R2
