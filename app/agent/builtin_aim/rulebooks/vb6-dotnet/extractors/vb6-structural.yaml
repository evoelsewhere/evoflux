# Structural extractor config — VB6
# Consumed by app/services/code_graph/parsers/structural.py (schema per
# documents/research/aim-framework.md §3.9): node_rules turn matched lines
# into graph nodes, edge_rules turn matched lines inside those nodes into
# calls/imports/references edges. Regex-only — no syntax awareness; tune
# against a real sample estate and measure extraction recall before
# trusting coverage (design-doc risk #1).

id: vb6-structural
description: >
  Extracts modules, forms, classes, and procedures as graph nodes, and
  calls/error-handler targets/member references as graph edges, from VB6
  source text without a full parser.

file_extensions: [".frm", ".bas", ".cls", ".ctl"]

# VB6 is case-insensitive.
ignore_case: true

node_rules:
  - kind: module
    scope: file
    match: 'Attribute VB_Name = "(?P<name>[^"]+)"'
  - kind: procedure
    scope: block
    match: '^\s*(Public\s+|Private\s+|Friend\s+)?(Static\s+)?(Sub|Function|Property\s+(Get|Let|Set))\s+(?P<name>\w+)\s*\('
    end_match: '^\s*End\s+(Sub|Function|Property)\s*$'

edge_rules:
  - kind: calls
    from: procedure
    match: '\b(?P<callee>[A-Za-z_]\w*)\s*\('
    # Language keywords that would otherwise match are dropped via
    # keyword_denylist below.
  - kind: references
    from: procedure
    # On Error GoTo <label> — the handler label is not a symbol node, so
    # this stays an unresolved name-ref; still useful as an FTS/search hook.
    match: 'On\s+Error\s+GoTo\s+(?P<label>\w+)'
  - kind: references
    from: procedure
    # Object.Member — reference the object side; the member alone is too
    # ambiguous to resolve cross-file.
    match: '\b(?P<name>[A-Za-z_]\w*)\.(?P<member>[A-Za-z_]\w*)'
    target_group: name

keyword_denylist:
  # Flow/declaration keywords and ubiquitous intrinsics that the permissive
  # calls regex would otherwise emit as callees.
  - If
  - ElseIf
  - While
  - Until
  - Select
  - Choose
  - Sub
  - Function
  - Property
  - Print
  - Format
  - Len
  - Mid
  - Left
  - Right
  - Trim
  - LTrim
  - RTrim
  - UCase
  - LCase
  - CInt
  - CLng
  - CStr
  - CDbl
  - CBool
  - CDate
  - CVar
  - Val
  - Str
  - Chr
  - Asc
  - InStr
  - IsNull
  - IsEmpty
  - IsNumeric
  - IsDate
  - UBound
  - LBound
  - Array
  - MsgBox
  - InputBox
  - Me
  - Err
  - Debug
