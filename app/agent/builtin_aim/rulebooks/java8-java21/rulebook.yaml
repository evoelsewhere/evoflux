# AIM rulebook manifest — java8-java21
# Schema per documents/research/aim-framework.md §3.7 in the EvoFlux repo.
# Status: content-only (AIM-0). Installed by the (not-yet-built) AIM-1
# aim_rulebook_service, which copies agents/skills/commands/workflows into
# the project's config/KB discovery roots.

id: java8-java21
version: "0.1"
description: >
  Upgrade a Java 8 (or 11) codebase to Java 21 in place — same language
  family, same build ecosystem, no cross-language translation. The
  simplest possible AIM pilot: validates the pipeline and the test-compare
  harness without also fighting a structural parser.

source:
  stack: java8
  file_extensions: [".java"]
target:
  stack: java21
  file_extensions: [".java"]

unit_kinds: [class, service, batch-job, module]

parser_strategy: tree_sitter   # Java already has a tree-sitter grammar in
                                # app/services/code_graph/parsers/ — no
                                # structural extractor needed for this pack.

compare_default_profile: default   # see canonicalizers/default.yaml

overlays:
  agents:
    - aim-converter   # adds the java-modernization-idioms skill
  skills:
    - java-modernization-idioms

runners:
  legacy: runners/run_legacy.sh
  target: runners/run_target.sh
