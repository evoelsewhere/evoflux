# Structural extractor config — COBOL
# Consumed by app/services/code_graph/parsers/structural.py. Per
# aim-framework.md §3.9: divisions/sections/paragraphs = nodes;
# PERFORM/CALL/COPY = calls/imports edges; EXEC SQL/CICS targets =
# references. Handles both fixed-format (sequence numbers in cols 1-6)
# and free-format source via the leading [\s0-9]{0,7} allowance.
#
# Known noise, accepted at this tier: level-77/88 data items that end in a
# bare period can false-positive as paragraphs (no division context in the
# flat block model), and matches inside comment lines are not filtered.
# Measure recall on the pilot estate before trusting coverage (risk #1).

id: cobol-structural
description: >
  Extracts the program plus divisions, sections, and paragraphs as graph
  nodes, and PERFORM/CALL/COPY/EXEC targets as graph edges, from COBOL
  source text without a grammar.

file_extensions: [".cbl", ".cob", ".cpy", ".cobol"]

# COBOL is case-insensitive.
ignore_case: true

node_rules:
  - kind: program
    scope: file
    match: 'PROGRAM-ID\s*\.?\s+(?P<name>[A-Za-z0-9][A-Za-z0-9-]*)'
  - kind: division
    scope: block
    match: '^[\s0-9]{0,7}(?P<name>IDENTIFICATION|ENVIRONMENT|DATA|PROCEDURE)\s+DIVISION\b'
  - kind: section
    scope: block
    match: '^[\s0-9]{0,7}(?P<name>[A-Za-z][A-Za-z0-9-]*)\s+SECTION\s*\.'
  - kind: paragraph
    scope: block
    # A paragraph label sits alone on its line, terminated by a period.
    match: '^[\s0-9]{0,7}(?P<name>[A-Za-z][A-Za-z0-9-]*)\s*\.\s*$'

edge_rules:
  # PERFORM <paragraph> — intra-program flow. Duplicated per source kind
  # because an edge rule scans exactly one node kind's lines.
  - kind: calls
    from: paragraph
    match: '\bPERFORM\s+(?P<target>[A-Za-z][A-Za-z0-9-]*)'
  - kind: calls
    from: section
    match: '\bPERFORM\s+(?P<target>[A-Za-z][A-Za-z0-9-]*)'
  # CALL "SUBPROG" — cross-program call (dynamic CALL WS-NAME is invisible
  # to regex; LLM enrichment covers it).
  - kind: calls
    from: paragraph
    match: '\bCALL\s+["''](?P<target>[A-Za-z0-9-]+)["'']'
  - kind: calls
    from: section
    match: '\bCALL\s+["''](?P<target>[A-Za-z0-9-]+)["'']'
  # COPY <copybook> — compile-time include; may appear at any level, so one
  # rule per structural kind that can contain it.
  - kind: imports
    from: division
    match: '\bCOPY\s+(?P<target>[A-Za-z0-9][A-Za-z0-9-]*)'
  - kind: imports
    from: section
    match: '\bCOPY\s+(?P<target>[A-Za-z0-9][A-Za-z0-9-]*)'
  - kind: imports
    from: paragraph
    match: '\bCOPY\s+(?P<target>[A-Za-z0-9][A-Za-z0-9-]*)'
  # EXEC CICS LINK/XCTL PROGRAM('X') — cross-program transfer.
  - kind: references
    from: paragraph
    match: 'EXEC\s+CICS\s+(?:LINK|XCTL)\s+PROGRAM\s*\(\s*["'']?(?P<target>[A-Za-z0-9-]+)'
  # EXEC SQL INCLUDE <member> — SQL copybook include.
  - kind: imports
    from: paragraph
    match: 'EXEC\s+SQL\s+INCLUDE\s+(?P<target>[A-Za-z0-9-]+)'

keyword_denylist:
  # PERFORM's inline/loop forms — "PERFORM UNTIL ..." etc. must not emit an
  # edge to a phantom paragraph named UNTIL.
  - UNTIL
  - VARYING
  - TIMES
  - THRU
  - THROUGH
  - WITH
  - TEST
  - FOREVER
