# AIM rulebook manifest — cobol-java21
# Schema per documents/research/aim-framework.md §3.7.
# Status: parser-first skeleton (AIM-3). This pack currently ships the
# structural extractor configs that put a COBOL/JCL estate into the code
# graph (the AIM-3 deliverable); the conversion-side content (mappings,
# canonicalizers, runners, agent/skill overlays) is authored when a real
# COBOL engagement scopes it — the generic AIM roster and skills apply
# until then.

id: cobol-java21
version: "0.1"
description: >
  Re-platform a COBOL/JCL estate to Java 21. The canonical hard case for
  AIM: no viable tree-sitter grammar, so comprehension starts from the
  structural extractors below (divisions/sections/paragraphs as nodes,
  PERFORM/CALL/COPY as edges) plus LLM enrichment into the KB.

source:
  stack: cobol
  file_extensions: [".cbl", ".cob", ".cpy", ".cobol", ".jcl", ".prc", ".proc"]
target:
  stack: java21
  file_extensions: [".java"]

unit_kinds: [program, copybook, job, batch-job, screen]

parser_strategy: structural   # consumed via extractors/*.yaml below —
                              # see app/services/code_graph/parsers/structural.py

extractors:
  - extractors/cobol-structural.yaml
  - extractors/jcl-structural.yaml

compare_default_profile: default
