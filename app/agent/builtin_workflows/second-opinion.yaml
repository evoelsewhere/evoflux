# Builtin example — the smallest useful forge workflow: one agent turn
# framed as a structured review, then a desktop ping.
schema_version: 1
name: second-opinion
description: Get a structured second opinion on any question or plan
scope: forge

inputs:
  - name: question
    type: string
    required: true
    description: "what to review"

nodes:
  - id: review
    kind: agent
    subagents: []
    prompt: |
      Give a structured second opinion on the following. Steelman it first,
      then list the strongest objections, then give your verdict with the
      single most important change you'd make.

      {{inputs.question}}

  - id: ping
    kind: notify
    title: "second-opinion"
    message: "Second opinion ready."

edges:
  - { from: review, to: ping }

outputs:
  opinion: "{{nodes.review.output.text}}"
