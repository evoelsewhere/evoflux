<section data-slide-root class="slide-canvas">
  <div data-pptx-mode="art" class="hero-glow" aria-hidden="true"></div>
  <svg
    data-pptx-editable="svg"
    data-pptx-name="signal-illustration"
    class="signal-illustration"
    viewBox="0 0 360 360"
    role="img"
    aria-label="A rising signal curve"
  >
    <circle cx="180" cy="180" r="150" fill="#152547" />
    <path d="M70 230 C130 110 210 275 300 100" fill="none" stroke="#65D6FF" stroke-width="18" stroke-linecap="round" />
  </svg>
  <div
    data-pptx-editable="shape"
    data-pptx-name="copy-panel"
    data-pptx-shape="roundRect"
    class="copy-panel"
    aria-hidden="true"
  ></div>
  <div class="copy-column">
    <p
      data-pptx-editable="text"
      data-pptx-name="opening-eyebrow"
      data-pptx-role="eyebrow"
      class="eyebrow"
    >EVOFLUX BRIEFING</p>
    <h1
      data-pptx-editable="text"
      data-pptx-name="opening-title"
      data-pptx-role="title"
    >HTML designs the slide. PowerPoint keeps the useful parts editable.</h1>
    <p
      data-pptx-editable="text"
      data-pptx-name="opening-subtitle"
      data-pptx-role="body"
      class="subtitle"
    >SVG preserves vector art as one picture; native overlays preserve copy and simple objects.</p>
  </div>
</section>
