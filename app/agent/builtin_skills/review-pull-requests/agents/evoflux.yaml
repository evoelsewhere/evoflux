interface:
  display_name: "Review Pull Requests"
  short_description: "Risk-based PR/MR review and lifecycle operations"
  default_prompt: "Use $review-pull-requests to perform a risk-based end-to-end review of the current PR or MR."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: builtin
      value: code_search
      description: "Parser-aligned source discovery across authorized repositories when the exact identifier is unknown"
    - type: builtin
      value: code_graph
      description: "Native exact-symbol relationships for changed-code impact and cross-repository review"
