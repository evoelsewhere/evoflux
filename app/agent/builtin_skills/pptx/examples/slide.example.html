<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 1280px;
        height: 720px;
        margin: 0;
        overflow: hidden;
      }
      body {
        color: #f8fafc;
        background: linear-gradient(135deg, #071426, #123b70);
        font-family: Arial, sans-serif;
      }
      main { padding: 88px; }
      .eyebrow { color: #5eead4; font-size: 22px; font-weight: 700; }
      h1 { width: 880px; margin: 24px 0; font-size: 68px; line-height: 1.04; }
      p { width: 760px; color: #cbd5e1; font-size: 28px; }
      .orb {
        position: absolute;
        right: 92px;
        bottom: 72px;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #5eead4, #2563eb);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ARTIFACT FABRIC</div>
      <h1>The operating model turns change into evidence.</h1>
      <p>Understand the system. Transform deliberately. Verify every output.</p>
    </main>
    <div class="orb"></div>
  </body>
</html>
