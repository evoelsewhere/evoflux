interface:
  display_name: "Design Code Tests"
  short_description: "Prove contracts with reliable test boundaries"
  default_prompt: "Use $coding-testing to design the smallest reliable test strategy for this behavior."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: builtin
      value: code_search
      description: "Parser-aligned source discovery across authorized repositories when the exact identifier is unknown"
    - type: builtin
      value: code_graph
      description: "Native exact-symbol definitions, callers, callees, references, impact, and cross-repository relationships"
