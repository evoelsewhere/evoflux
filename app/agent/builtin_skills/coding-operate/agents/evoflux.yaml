interface:
  display_name: "Operate Code"
  short_description: "Measure performance, instrument signals, structure delivery"
  default_prompt: "Use $coding-operate to measure, instrument, or structure the delivery of this change."
policy:
  allow_implicit_invocation: true
dependencies:
  # Only the tool every workflow in this hub needs. Built-in dependencies are a
  # hard activation gate, so the git/PR tools used by just
  # references/workflows/git-workflow.md must not be declared here — they would
  # make performance and observability unloadable wherever they are absent.
  tools:
    - type: builtin
      value: code_context
      description: "Unified indexed search, structural grep, exact-symbol graph navigation, and dynamic cross-repository resolution"
