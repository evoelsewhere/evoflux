interface:
  display_name: "Review Code Changes"
  short_description: "Find actionable defects in local code changes"
  default_prompt: "Use $coding-review to audit this change for production-impacting defects without editing it."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: builtin
      value: code_search
      description: "Parser-aligned source discovery across authorized repositories when the exact identifier is unknown"
    - type: builtin
      value: code_graph
      description: "Native exact-symbol definitions, callers, callees, references, impact, and cross-repository relationships"
