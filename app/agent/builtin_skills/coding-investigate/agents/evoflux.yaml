interface:
  display_name: "Investigate Code"
  short_description: "Trace code paths, find root causes, verify defects live"
  default_prompt: "Use $coding-investigate to understand this code or find the cause of this failure with bounded source evidence."
policy:
  allow_implicit_invocation: true
dependencies:
  # Only the tool every workflow in this hub needs. Built-in dependencies are a
  # hard activation gate, so a tool that just one workflow uses (browser_use for
  # references/workflows/browser-verify.md) must not be declared here — it would
  # make investigation and debugging unloadable wherever that tool is absent.
  tools:
    - type: builtin
      value: code_context
      description: "Unified indexed search, structural grep, exact-symbol graph navigation, and dynamic cross-repository resolution"
