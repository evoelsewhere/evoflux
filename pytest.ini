[pytest]
env =
    EVOFLUX_DATA_DIR=.tests/data
    EVOFLUX_CONFIG_DIR=.tests/config
    EVOFLUX_STATE_DIR=.tests/state
    EVOFLUX_CACHE_DIR=.tests/cache
    EVOFLUX_WIKI_DIR=.tests/wiki
    EVOFLUX_MODEL_REGISTRY_REFRESH=false
    EVOFLUX_CODE_INDEX_EXECUTION=thread
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts =
    --cov=app
    --cov-report=term-missing:skip-covered
    --no-cov-on-fail
    -q
markers =
    asyncio: mark a test as an asyncio-based test.
    slow: mark a test as slow.

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
