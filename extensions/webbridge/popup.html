<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
    }
    .status-card {
      background: #252525;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .status-dot.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text {
      font-size: 13px;
      font-weight: 500;
    }
    .detail {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      line-height: 1.4;
    }
    .detail.auth-error { color: #ef4444; }
    .tab-info {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 11px;
      color: #aaa;
    }
    .tab-title {
      color: #ddd;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-url {
      color: #60a5fa;
      word-break: break-all;
    }
    .config-card {
      background: #252525;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .config-card label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 4px;
    }
    .config-card input {
      width: 100%;
      padding: 7px 9px;
      margin-bottom: 10px;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
    }
    .config-card input:focus { border-color: #6366f1; }
    .config-card input:last-of-type { margin-bottom: 6px; }
    .config-hint {
      font-size: 10px;
      color: #666;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    .btn-primary:hover { background: #5558e6; }
    .btn-danger {
      background: #3a1a1a;
      color: #ef4444;
      margin-top: 8px;
    }
    .btn-danger:hover { background: #4a1a1a; }
    .btn-secondary {
      margin-top: 10px;
      padding: 8px;
      background: #333;
      color: #d4d4d4;
      border: 1px solid #444;
    }
    .btn-secondary:hover { background: #3d3d3d; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="icons/icon128.png" alt="EvoFlux" /></div>
    <div>
      <div class="title">EvoFlux WebBridge</div>
      <div class="subtitle">Browser Agent Bridge</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Connecting...</span>
    </div>
    <div class="detail" id="statusDetail">Connecting to EvoFlux relay server...</div>
    <div class="tab-info" id="tabInfo" style="display:none">
      <div>Active tab:</div>
      <div class="tab-title" id="tabTitle"></div>
      <div class="tab-url" id="tabUrl"></div>
    </div>
    <div class="detail" id="controlDetail"></div>
    <button class="btn btn-secondary" id="releaseBtn" style="display:none">
      Release browser control
    </button>
  </div>

  <div class="config-card">
    <label for="relayBase">Relay URL</label>
    <input id="relayBase" type="text" placeholder="ws://127.0.0.1:8000" spellcheck="false" autocomplete="off">
    <label for="accessToken">Access token</label>
    <input id="accessToken" type="password" placeholder="Required in desktop mode" autocomplete="off">
    <div class="config-hint">Saved automatically; reconnects on change. The token is the same one the EvoFlux app uses (desktop token or server access key).</div>
  </div>

  <button class="btn btn-primary" id="connectBtn">
    Reconnect
  </button>

  <div class="footer">
    EvoFlux WebBridge v<span id="extensionVersion"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
