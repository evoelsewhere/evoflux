id: project-rulebook
version: "0.1"
description: >
  Project-owned migration policy. Replace the sample stack metadata and adapt
  only the rulebook subitems required by this engagement.

source:
  stack: replace-with-source-stack
  file_extensions: [".legacy"]
target:
  stack: replace-with-target-stack
  file_extensions: [".target"]

unit_kinds: [program]
parser_strategy: none  # tree_sitter | structural | none

capabilities:
  inventory: template
  understand: template
  design: template
  convert: template
  compare: template
  cutover: template

compare_default_profile: default

