[package]
name = "evoflux-desktop"
version = "2.0.8"
description = "EvoFlux — on-machine AI agents (desktop shell)"
authors = ["EvoFlux contributors"]
license = "Apache-2.0"
repository = "https://github.com/evoelsewhere/evoflux"
edition = "2021"
rust-version = "1.77"

# https://crates.io/crates/tauri-build
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
log = "0.4"
anyhow = "1"
once_cell = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2.10.1"
url = "2.5.8"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
notify = "7"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
file_icon_provider = "0.4"
png = "0.17"
# Computer App Control: window capture and preview frames.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = { version = "0.9.8", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# xcap 0.9.x pulls pipewire/libspa 0.10, whose generated bindings require
# newer PipeWire headers than Ubuntu 22.04 provides. The 0.4 line exposes the
# same Monitor/image API used here without raising the distro baseline.
xcap-linux = { package = "xcap", version = "=0.4.1", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-speech = { version = "0.3.2", default-features = false, features = ["SFSpeechRecognizer", "block2"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Computer App Control: "elcapitan" adds posting events to one process,
# "highsierra" scroll-wheel events.
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
core-foundation = "0.10"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSError"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["block2", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKWebView"] }


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-version = "0.1"
windows ={ version = "0.61", features = [
    "Win32_Foundation",
    # Computer App Control: PrintWindow capture, frame bounds, UI Automation.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    # Computer App Control: resolving Start menu shortcuts for the app picker.
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    # Required for CreateJobObjectW (it takes a
    # SECURITY_ATTRIBUTES pointer in its signature).
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

# A WebView2 host with the same window layout as Teams (host window →
# Chrome_WidgetWin_0 → WebView2's Chrome_WidgetWin_1), for the Computer App
# Control live tests. Both already come in through Tauri.
[target.'cfg(windows)'.dev-dependencies]
tao = "0.35"
wry = "0.55"

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
