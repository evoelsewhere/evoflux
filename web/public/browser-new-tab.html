<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>New tab</title>
    <style>
      :root { font-family: "Source Sans 3", ui-sans-serif, sans-serif; color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #202124; }
      main { text-align: center; transform: translateY(-3vh); }
      .globe { width: 38px; height: 38px; margin: 0 auto 16px; border: 2px solid #7b818a; border-radius: 50%; position: relative; }
      .globe::before { content: ""; position: absolute; inset: 7px -2px; border-top: 2px solid #7b818a; border-bottom: 2px solid #7b818a; }
      .globe::after { content: ""; position: absolute; inset: -2px 10px; border-left: 2px solid #7b818a; border-right: 2px solid #7b818a; border-radius: 50%; }
      h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0; }
      p { margin: 7px 0 0; font-size: 13px; color: #777d86; }
      @media (prefers-color-scheme: dark) { body { background: #171918; color: #eef0ef; } }
    </style>
  </head>
  <body>
    <main>
      <div class="globe" aria-hidden="true"></div>
      <h1>Start browsing</h1>
      <p>Enter a URL or search in the address bar</p>
    </main>
  </body>
</html>
