<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-assets/evoflux-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <title>EvoFlux</title>
    <script src="/theme-init.js"></script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: var(--bg-page, #ffffff);
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted, #a3a3a3);
        font: 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-boot-loader__pill {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--color-border, #e5e5e5);
        border-radius: 9999px;
        background: var(--color-surface, #ffffff);
        padding: 12px 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .app-boot-loader__dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--color-text, #0a0a0a);
        animation: app-boot-pulse 1.2s ease-in-out infinite;
      }

      html.dark .app-boot-loader,
      :root.dark .app-boot-loader {
        color: var(--color-text-muted, #737373);
      }

      html.dark .app-boot-loader__pill,
      :root.dark .app-boot-loader__pill {
        border-color: var(--color-border, #262626);
        background: var(--color-surface, #171717);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      html.dark .app-boot-loader__dot,
      :root.dark .app-boot-loader__dot {
        background: var(--color-text, #f5f5f5);
      }

      @keyframes app-boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-live="polite"><div class="app-boot-loader__pill"><span class="app-boot-loader__dot"></span>Loading EvoFlux...</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
