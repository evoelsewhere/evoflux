<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-assets/evoflux-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <title>EvoFlux</title>
    <script src="/theme-init.js"></script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #faf6ec;
      }

      html.dark,
      html.dark body,
      html.dark #root {
        background: #15110d;
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7a6b58;
        font: 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-boot-loader__pill {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #d7c7aa;
        border-radius: 9999px;
        background: #fffbf1;
        padding: 12px 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .app-boot-loader__dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #3f3429;
        animation: app-boot-pulse 1.2s ease-in-out infinite;
      }

      html.dark .app-boot-loader {
        color: #9c8a72;
      }

      html.dark .app-boot-loader__pill {
        border-color: #3a2f23;
        background: #1c1813;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      html.dark .app-boot-loader__dot {
        background: #f5ebd8;
      }

      @keyframes app-boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-live="polite"><div class="app-boot-loader__pill"><span class="app-boot-loader__dot"></span>Loading EvoFlux...</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
