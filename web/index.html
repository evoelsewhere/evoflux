<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-assets/evoflux-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#232220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <title>Evoflux</title>
    <script src="/theme-init.js"></script>
    <script src="/appearance-init.js"></script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: var(--bg-page, #FAFAFA);
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-page, #FAFAFA);
      }

      .app-boot-loader__wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-boot-loader__glow {
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: var(--color-accent, #A39D96);
        opacity: 0.2;
        filter: blur(18px);
        animation: app-boot-glow 2s ease-in-out infinite;
      }

      .app-boot-loader__icon {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 14px;
      }

      @keyframes app-boot-glow {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__glow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-label="Loading EvoFlux"><div class="app-boot-loader__wrap"><div class="app-boot-loader__glow"></div><img class="app-boot-loader__icon" src="/brand-assets/evoflux-app-icon.png" width="52" height="52" alt="" aria-hidden="true" /></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
