name: Desktop build

on:
  workflow_dispatch: {}
  push:
    tags:
      - "desktop-v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple Silicon)
          - os: macos-13
            name: macOS (Intel)
          - os: ubuntu-22.04
            name: Linux (x64)
          - os: windows-latest
            name: Windows (x64)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python (runs the sidecar build script)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Python sidecar bundle
        run: python scripts/build_sidecar.py --root . --out desktop/sidecar-bundle --python-version 3.12

      - name: Build & package desktop app
        working-directory: desktop
        run: cargo tauri build

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evoflux-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
