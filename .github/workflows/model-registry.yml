name: Bundled model registry

# The runtime refreshes model metadata from models.dev on its own (see
# app/agent/providers/registry_refresh.py). The bundled snapshot is what a
# cold, offline install resolves models with before that first fetch, and
# nothing regenerates it — so this job watches for it going stale and opens
# a reviewable pull request when models.dev changes.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so this does not join the stampede of
    # jobs every scheduler fires at :00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-registry
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh bundled model registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh snapshot from models.dev
        shell: bash
        run: |
          uv run python scripts/update_model_registry.py
          {
            echo "### Bundled model registry"
            echo
            echo '```'
            git diff --stat
            git diff -- app/agent/providers/model_registry.json app/agent/providers/provider_catalog.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request for refreshed snapshot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/model-registry-refresh
          delete-branch: false
          commit-message: "chore: refresh bundled model registry"
          title: "chore: refresh bundled model registry"
          body: |
            ## Summary

            Refresh the bundled model and provider snapshots from models.dev.

            This PR was opened automatically by the scheduled model-registry workflow so the snapshot can be reviewed before landing on `main`.

            ## Verification

            - `uv run python scripts/update_model_registry.py`
            - The generated snapshot and provider catalog are included in this PR.
