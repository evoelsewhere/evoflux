name: Migration gates

on:
  pull_request:
    branches: [migrate/rust-v4]
  push:
    branches: [migrate/rust-v4]
  schedule:
    - cron: "17 6 1 * *"

concurrency:
  group: migration-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  gates:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: python -c 'import tomllib; print("channel=" + tomllib.load(open("server/rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-mutants
      - name: Run migration gates
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in
            migrate/shared-*) area=shared ;;
            migrate/cutover-*) area=${HEAD_BRANCH#migrate/} ;;
            migrate/*) area=${HEAD_BRANCH#migrate/} ;;
            *) echo "Unexpected branch: $HEAD_BRANCH" >&2; exit 1 ;;
          esac
          bash scripts/migration/gates.sh "$area"

  push-gates:
    if: github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: python -c 'import tomllib; print("channel=" + tomllib.load(open("server/rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - name: Run shared migration gates
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          export GATES_DIFF_BASE="$base"
          bash scripts/migration/gates.sh shared
      - name: Run workspace tests
        working-directory: server
        run: cargo nextest run --workspace

  contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [python, gateway]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: python -c 'import tomllib; print("channel=" + tomllib.load(open("server/rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: uv sync --group contract
      - name: Build contract test binaries
        working-directory: server
        shell: bash
        run: |
          cargo build -p evoflux-server
          cargo build -p evoflux-gateway --bin evoflux-gateway-harness
          cargo build -p evoflux-core --example db_stress
      - name: Run contract suite
        env:
          TARGET: ${{ matrix.target }}
        run: uv run --group contract pytest contract-tests -q -rs --no-cov --junitxml=contract-results.xml
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.os }}-${{ matrix.target }}
          path: contract-results.xml
          if-no-files-found: warn

  db-compat:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          if git diff --name-only "$base" HEAD -- server/crates/core/src/db server/vendor server/crates/core/examples/db_stress.rs contract-tests/db contract-tests/fixtures/upgrade | grep -q .; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.needed == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.changes.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.changes.outputs.needed == 'true'
        name: Install latest official stock SQLite CLI
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, io, os, pathlib, platform, re, subprocess, urllib.request, zipfile
          machine = platform.machine().lower()
          system = platform.system()
          if system == 'Windows':
              platform_id = 'win-x64'
          elif system == 'Darwin':
              platform_id = 'osx-arm64' if machine in ('arm64', 'aarch64') else 'osx-x64'
          elif system == 'Linux' and machine in ('x86_64', 'amd64'):
              platform_id = 'linux-x64'
          else:
              raise SystemExit(f'Unsupported SQLite CLI platform: {system} {machine}')
          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'EvoFlux-SQLite-compat'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  return response.read()
          html = fetch('https://www.sqlite.org/download.html').decode('utf-8')
          pattern = rf'^PRODUCT,([^,]+),([^,]*/sqlite-tools-{platform_id}-[0-9]+\.zip),[0-9]+,([0-9a-f]{{64}})$'
          match = re.search(pattern, html, re.M)
          if not match:
              raise SystemExit(f'Cannot find latest official SQLite tools for {platform_id}')
          version, path, digest = match.groups()
          data = fetch('https://www.sqlite.org/' + path)
          if hashlib.sha3_256(data).hexdigest() != digest:
              raise SystemExit('SQLite tools SHA3-256 mismatch')
          name = 'sqlite3.exe' if os.name == 'nt' else 'sqlite3'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              names = [n for n in archive.namelist() if n.rsplit('/', 1)[-1] == name]
              if len(names) != 1:
                  raise SystemExit(f'Expected one {name}, found {names}')
              binary = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              binary.write_bytes(archive.read(names[0]))
          binary.chmod(0o755)
          actual = subprocess.check_output([str(binary), '--version'], text=True).split()[0]
          if actual != version:
              raise SystemExit(f'SQLite version mismatch: {actual} != {version}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'EVOFLUX_SQLITE_CLI={binary}\n')
          print(f'Using stock SQLite {version}')
          PYCODE
      - if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          cd server
          cargo build -p evoflux-core --example db_stress
          cd ..
          uv run --group contract pytest contract-tests/db -q --no-cov

  sqlite-release-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Compare SQLite release and open an issue if the pin is behind
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import json, os, re, subprocess, tomllib, urllib.request
          with open('server/vendor/SQLITE_BRANCH.toml', 'rb') as f:
              pinned = tomllib.load(f)['based_on_release']
          request = urllib.request.Request('https://www.sqlite.org/download.html', headers={'User-Agent': 'EvoFlux-SQLite-version-check'})
          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode('utf-8')
          match = re.search(r'sqlite-autoconf-(\d+)\.tar\.gz', html)
          if not match:
              raise SystemExit('Cannot determine the latest SQLite release')
          n = int(match.group(1))
          latest_parts = (n // 1000000, (n // 10000) % 100, (n // 100) % 100, n % 100)
          latest = '.'.join(map(str, latest_parts if latest_parts[-1] else latest_parts[:3]))
          pinned_parts = tuple(map(int, pinned.split('.')))
          pinned_parts += (0,) * (4 - len(pinned_parts))
          if pinned_parts >= latest_parts:
              print(f'SQLite pin {pinned} is current (latest {latest})')
              raise SystemExit(0)
          title = f'Update pinned SQLite branch for release {latest}'
          issues = json.loads(subprocess.check_output(['gh', 'issue', 'list', '--state', 'open', '--search', f'"{title}" in:title', '--json', 'title'], text=True))
          if not any(item['title'] == title for item in issues):
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', f'Pinned base: {pinned}. Latest SQLite release: {latest}. Review security fixes and update the begin-concurrent build.'], check=True)
          PYCODE
