name: Release

on:
  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.12"
  BUN_VERSION: "latest"
  SIDECAR_DIR: desktop/sidecar-bundle

jobs:
  # ── Build sidecar for all platforms ───────────────────────────────────
  sidecar:
    name: Sidecar (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build sidecar
        shell: bash
        run: |
          python scripts/build_sidecar.py \
            --root . \
            --out ${{ env.SIDECAR_DIR }} \
            --python-version 3.12

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: ${{ env.SIDECAR_DIR }}/
          retention-days: 1
          if-no-files-found: error

  # ── Build desktop apps ────────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            platform: macos
            targets: "app,dmg"

          - name: Linux (x64)
            os: ubuntu-latest
            platform: linux
            targets: "appimage,deb"
            extra_deps: "libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf"

          - name: Windows (x64)
            os: windows-latest
            platform: windows
            targets: "msi"

    steps:
      - uses: actions/checkout@v4

      # ── Web frontend ─────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build web frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # ── Rust toolchain ───────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-${{ runner.os }}-

      # ── Platform dependencies ────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.extra_deps }}

      # ── Tauri CLI ────────────────────────────────────────────────────
      - name: Install Tauri CLI
        uses: dtolnay/install-tauri-cli@stable
        with:
          tauri-version: ">=2"

      # ── Download sidecar ─────────────────────────────────────────────
      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: ${{ env.SIDECAR_DIR }}/

      # ── Build ────────────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: desktop/src-tauri
        env:
          TAURI_SKIP_FRONTEND_BUILD: "1"
        run: |
          cargo tauri build --bundles ${{ matrix.targets }}

      # ── Upload artifacts ─────────────────────────────────────────────
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: error

  # ── Create GitHub Release ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -50

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" \) \
            -exec sha256sum {} \; > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
