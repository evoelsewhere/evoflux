name: Build desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to build
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "macos-intel"
          - "macos-apple-silicon"
          - "windows-x64"
      signing:
        description: Sign and notarize when credentials are available
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "required"
          - "off"

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  BUN_VERSION: latest
  SIDECAR_DIR: desktop/sidecar-bundle
  SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || 'auto' }}

jobs:
  prepare:
    name: Select build platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Create build matrix
        id: matrix
        shell: bash
        env:
          SELECTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          case "$SELECTED_PLATFORM" in
            all)
              matrix='{"include":[{"name":"DMG · Intel","os":"macos-15-intel","artifact":"evoflux-macos-intel","architecture":"x86_64","dmg_architecture":"x64"},{"name":"DMG · Apple Silicon","os":"macos-15","artifact":"evoflux-macos-apple-silicon","architecture":"arm64","dmg_architecture":"aarch64"},{"name":"NSIS · Windows x64","os":"windows-2022","artifact":"evoflux-windows-x64","architecture":"x86_64"}]}'
              ;;
            macos-intel)
              matrix='{"include":[{"name":"DMG · Intel","os":"macos-15-intel","artifact":"evoflux-macos-intel","architecture":"x86_64","dmg_architecture":"x64"}]}'
              ;;
            macos-apple-silicon)
              matrix='{"include":[{"name":"DMG · Apple Silicon","os":"macos-15","artifact":"evoflux-macos-apple-silicon","architecture":"arm64","dmg_architecture":"aarch64"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"name":"NSIS · Windows x64","os":"windows-2022","artifact":"evoflux-windows-x64","architecture":"x86_64"}]}'
              ;;
            *)
              echo "Unsupported platform: $SELECTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve macOS signing mode
        if: runner.os == 'macOS'
        id: mac_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          enabled=false
          if [[ "$SIGNING_MODE" == "required" && ${#missing[@]} -gt 0 ]]; then
            echo "Signing is required, but these macOS secrets are missing: ${missing[*]}" >&2
            exit 1
          elif [[ "$SIGNING_MODE" != "off" && ${#missing[@]} -eq 0 ]]; then
            enabled=true
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == "true" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A -out "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "Developer ID signing and Apple notarization are enabled."
          else
            echo "Building with an ad-hoc macOS signature."
          fi

      - name: Resolve Windows signing mode
        if: runner.os == 'Windows'
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $missing += "WINDOWS_CERTIFICATE"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $missing += "WINDOWS_CERTIFICATE_PASSWORD"
          }

          $enabled = $false
          if ($env:SIGNING_MODE -eq "required" -and $missing.Count -gt 0) {
            throw "Signing is required, but these Windows secrets are missing: $($missing -join ', ')"
          } elseif ($env:SIGNING_MODE -ne "off" -and $missing.Count -eq 0) {
            $enabled = $true
          }

          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            Write-Host "Authenticode signing is enabled."
          } else {
            Write-Host "Building an unsigned NSIS installer."
          }

      - name: Resolve updater signing
        id: updater_signing
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          missing=()
          [[ -n "$UPDATER_PRIVATE_KEY" ]] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [[ -n "$UPDATER_PUBLIC_KEY" ]] || missing+=(TAURI_SIGNING_PUBLIC_KEY)

          enabled=false
          if [[ "$GITHUB_REF" == refs/tags/* && ${#missing[@]} -gt 0 ]]; then
            echo "Tagged releases require updater signing; missing: ${missing[*]}" >&2
            exit 1
          elif [[ ${#missing[@]} -eq 0 ]]; then
            enabled=true
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == "true" ]]; then
            echo "Signed updater artifacts are enabled."
          else
            echo "Updater artifacts are disabled for this non-release build."
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build native Python sidecar
        shell: bash
        run: |
          python scripts/build_sidecar.py \
            --root . \
            --out "$SIDECAR_DIR" \
            --python-version "$PYTHON_VERSION"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.windows_signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "evoflux-signing.pfx"
          try {
            $base64 = $env:WINDOWS_CERTIFICATE -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
            $password = ConvertTo-SecureString `
              -String $env:WINDOWS_CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force
            $imported = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable
            $certificate = $imported |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) {
              throw "The PFX did not contain a certificate with a private key."
            }
            "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Remove stale bundle outputs
        shell: bash
        run: rm -rf desktop/src-tauri/target/release/bundle

      - name: Write platform bundle override
        shell: bash
        env:
          UPDATER_ENABLED: ${{ steps.updater_signing.outputs.enabled }}
          MAC_SIGNING_ENABLED: ${{ steps.mac_signing.outputs.enabled }}
          WINDOWS_SIGNING_ENABLED: ${{ steps.windows_signing.outputs.enabled }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          bundle = {
              "createUpdaterArtifacts": os.environ["UPDATER_ENABLED"] == "true"
          }
          if os.environ["RUNNER_OS"] == "macOS" and os.environ.get("MAC_SIGNING_ENABLED") != "true":
              bundle["macOS"] = {"signingIdentity": "-"}
          if os.environ["RUNNER_OS"] == "Windows" and os.environ.get("WINDOWS_SIGNING_ENABLED") == "true":
              bundle["windows"] = {
                  "certificateThumbprint": os.environ["WINDOWS_CERT_THUMBPRINT"],
                  "digestAlgorithm": "sha256",
                  "timestampUrl": "http://timestamp.digicert.com",
              }

          path = Path(os.environ["RUNNER_TEMP"]) / "evoflux-bundle-override.json"
          path.write_text(json.dumps({"bundle": bundle}), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TAURI_BUNDLE_CONFIG={path}\n")
          PY

      - name: Build macOS app
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          EVOFLUX_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles app --verbose --config "$TAURI_BUNDLE_CONFIG"

      - name: Prepare macOS updater assets
        if: runner.os == 'macOS' && steps.updater_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}.sig" ]]; then
            echo "Expected one signed macOS updater archive." >&2
            exit 1
          fi
          config=desktop/src-tauri/tauri.conf.json
          product_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["productName"])' "$config")"
          version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$config")"
          updater_dir=desktop/src-tauri/target/release/bundle/updater
          updater_path="$updater_dir/${product_name}_${version}_${{ matrix.dmg_architecture }}.app.tar.gz"
          mkdir -p "$updater_dir"
          mv "${archives[0]}" "$updater_path"
          mv "${archives[0]}.sig" "$updater_path.sig"

      - name: Create DMG without mounting a volume
        if: runner.os == 'macOS'
        id: create_dmg
        shell: bash
        run: |
          set -euo pipefail
          config=desktop/src-tauri/tauri.conf.json
          product_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["productName"])' "$config")"
          version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$config")"
          source_dir=desktop/src-tauri/target/release/bundle/macos
          dmg_dir=desktop/src-tauri/target/release/bundle/dmg
          dmg_path="$dmg_dir/${product_name}_${version}_${{ matrix.dmg_architecture }}.dmg"

          app_path="$(find "$source_dir" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Tauri completed without producing an app bundle." >&2
            exit 1
          fi

          ln -s /Applications "$source_dir/Applications"
          mkdir -p "$dmg_dir"
          hdiutil create \
            -volname "$product_name" \
            -srcfolder "$source_dir" \
            -ov \
            -format UDZO \
            "$dmg_path"
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Sign and notarize DMG
        if: runner.os == 'macOS' && steps.mac_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          codesign \
            --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "${{ steps.create_dmg.outputs.path }}"
          xcrun notarytool submit "${{ steps.create_dmg.outputs.path }}" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "${{ steps.create_dmg.outputs.path }}"

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri
        env:
          EVOFLUX_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis --verbose --config $env:TAURI_BUNDLE_CONFIG

      - name: Validate Windows updater asset
        if: runner.os == 'Windows' && steps.updater_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          signatures=(desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          if [[ ${#signatures[@]} -ne 1 ]]; then
            echo "Expected one signed Windows updater artifact." >&2
            exit 1
          fi

      - name: Smoke-test first Windows app launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "evoflux-first-launch"
          $env:EVOFLUX_DATA_DIR = Join-Path $smokeRoot "data"
          $env:EVOFLUX_CONFIG_DIR = Join-Path $smokeRoot "config"
          $env:EVOFLUX_STATE_DIR = Join-Path $smokeRoot "state"
          $env:EVOFLUX_CACHE_DIR = Join-Path $smokeRoot "cache"
          $env:EVOFLUX_WIKI_DIR = Join-Path $smokeRoot "wiki"
          $env:EVOFLUX_WORKSPACE_DIR = Join-Path $smokeRoot "workspace"
          New-Item $smokeRoot -ItemType Directory -Force | Out-Null

          $tauriConfig = Get-Content `
            "desktop/src-tauri/tauri.conf.json" `
            -Raw | ConvertFrom-Json
          $windowsLocalAppData = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::LocalApplicationData
          )
          $appLogDir = Join-Path `
            $windowsLocalAppData `
            "$($tauriConfig.identifier)/logs"
          $backendLog = Join-Path $appLogDir "backend.log"
          Remove-Item $appLogDir -Recurse -Force -ErrorAction SilentlyContinue

          $installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" `
              -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installerProcess = Start-Process `
            -FilePath $installers[0].FullName `
            -ArgumentList "/S" `
            -PassThru `
            -Wait
          if ($installerProcess.ExitCode -ne 0) {
            throw "Silent NSIS installation failed with exit code $($installerProcess.ExitCode)."
          }

          $uninstallKey = `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$($tauriConfig.productName)"
          $installLocation = (
            Get-ItemPropertyValue `
              -Path $uninstallKey `
              -Name InstallLocation `
              -ErrorAction Stop
          ).Trim('"')
          $executable = Join-Path `
            $installLocation `
            "$($tauriConfig.mainBinaryName).exe"
          if (-not (Test-Path $executable)) {
            throw "Installed executable was not found at '$executable'."
          }

          $process = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(120)
            $ready = $false
            $lastLog = ""
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $backendLog) {
                $lastLog = Get-Content $backendLog -Raw -ErrorAction SilentlyContinue
                if ($lastLog -match "startup_timing phase=server_ready") {
                  $ready = $true
                }
              }
              if ($ready) {
                break
              }
              if ($process.HasExited) {
                throw "EvoFlux exited before the bundled backend became ready.`n$lastLog"
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "First Windows launch did not become ready within 120 seconds.`n$lastLog"
            }
            Write-Host "First Windows launch reached backend-ready state."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(10000) | Out-Null
            }
          }

      - name: Verify DMG architecture and signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "Tauri completed without producing both an app and a DMG." >&2
            exit 1
          fi

          binary="$app_path/Contents/MacOS/EvoFlux"
          file "$binary" | tee "$RUNNER_TEMP/evoflux-architecture.txt"
          grep -q "${{ matrix.architecture }}" "$RUNNER_TEMP/evoflux-architecture.txt"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"

          if [[ "${{ steps.mac_signing.outputs.enabled }}" == "true" ]]; then
            codesign --verify --verbose=2 "$dmg_path"
            xcrun stapler validate "$dmg_path"
          fi

      - name: Verify NSIS installer signature
        if: runner.os == 'Windows' && steps.windows_signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -eq 0) {
            throw "Tauri completed without producing an NSIS installer."
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on '$($file.Name)': $($signature.Status)"
            }
          }

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle/dmg
          shasum -a 256 ./*.dmg > "$RUNNER_TEMP/${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -eq 0) {
            throw "Tauri completed without producing an NSIS installer."
          }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "$env:RUNNER_TEMP/${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Upload DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/updater/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/updater/*.app.tar.gz.sig
            ${{ runner.temp }}/${{ matrix.artifact }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            ${{ runner.temp }}/${{ matrix.artifact }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Validate release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          versions = {
              "pyproject.toml": tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"],
              "app/version.txt": (root / "app/version.txt").read_text().strip(),
              "web/package.json": json.loads((root / "web/package.json").read_text())["version"],
              "desktop/src-tauri/Cargo.toml": tomllib.loads((root / "desktop/src-tauri/Cargo.toml").read_text())["package"]["version"],
              "desktop/src-tauri/tauri.conf.json": json.loads((root / "desktop/src-tauri/tauri.conf.json").read_text())["version"],
          }
          unique = set(versions.values())
          if len(unique) != 1:
              raise SystemExit(f"release versions are out of sync: {versions}")
          version = unique.pop()
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match version {version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={version}\n")
          PY

      - name: Package WebBridge extension
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version extensions/webbridge/manifest.json)"
          filename="EvoFlux-WebBridge-${version}.zip"
          output="$GITHUB_WORKSPACE/release-assets/$filename"
          (cd extensions/webbridge && zip -qr "$output" .)
          (cd release-assets && sha256sum "$filename" > "EvoFlux-WebBridge-${version}-SHA256SUMS.txt")

      - name: Create draft release and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace immutable assets." >&2
              exit 1
            fi
            gh release edit "$TAG" --title "EvoFlux v$VERSION"
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "EvoFlux v$VERSION"
          fi
          gh release view "$TAG" --json body --jq .body > release-notes.md

      - name: Generate updater manifest
        run: |
          python scripts/generate_updater_manifest.py \
            --artifacts-dir release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ steps.version.outputs.value }}" \
            --notes-file release-notes.md \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output release-assets/latest.json

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false --latest
