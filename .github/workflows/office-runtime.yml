name: Office runtime

# Builds the trimmed LibreOffice runtime the document viewer installs on
# request, proves it end to end on every platform (real installer, signature
# check, DOCX/PPTX/XLSX conversion through the preview pipeline) and, when
# asked, publishes the signed archives as a GitHub release.
#
# Pull requests that touch the runtime build or install code run the same
# build and verification with a throwaway signing key; nothing is published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: LibreOffice version from download.documentfoundation.org/libreoffice/stable
        required: true
        default: "26.8.0"
      publish:
        description: Sign with the release key and publish the release assets
        type: boolean
        default: false
  pull_request:
    paths:
      - app/services/office_runtime/**
      - scripts/build_libreoffice_runtime.py
      - scripts/verify_office_runtime.py
      - .github/workflows/office-runtime.yml

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LIBREOFFICE_VERSION: ${{ inputs.version || '26.8.0' }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
  RELEASE_TAG: office-runtime-${{ inputs.version || '26.8.0' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS · Apple Silicon
            os: macos-15
            platform: darwin-arm64
          - name: macOS · Intel
            os: macos-15-intel
            platform: darwin-x64
          - name: Windows x64
            os: windows-2022
            platform: win32-x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra office-preview

      - name: Prepare signing key
        env:
          OFFICE_RUNTIME_SIGNING_KEY: ${{ secrets.OFFICE_RUNTIME_SIGNING_KEY }}
          OFFICE_RUNTIME_KEY_ID: ${{ vars.OFFICE_RUNTIME_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ "$PUBLISH" = "true" ]; then
            if [ -z "$OFFICE_RUNTIME_SIGNING_KEY" ] || [ -z "$OFFICE_RUNTIME_KEY_ID" ]; then
              echo "Publishing needs the OFFICE_RUNTIME_SIGNING_KEY secret and OFFICE_RUNTIME_KEY_ID variable." >&2
              exit 1
            fi
            printf '%s\n' "$OFFICE_RUNTIME_SIGNING_KEY" > "$RUNNER_TEMP/keys/office.private.pem"
            uv run python - "$RUNNER_TEMP/keys" <<'PY'
          import sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          keys = Path(sys.argv[1])
          key = serialization.load_pem_private_key((keys / "office.private.pem").read_bytes(), None)
          (keys / "office.public.pem").write_bytes(
              key.public_key().public_bytes(
                  serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo
              )
          )
          PY
            echo "KEY_ID=$OFFICE_RUNTIME_KEY_ID" >> "$GITHUB_ENV"
          else
            uv run python scripts/build_libreoffice_runtime.py --generate-key "$RUNNER_TEMP/keys/office"
            echo "KEY_ID=ci-ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Build trimmed runtime
        run: |
          uv run python scripts/build_libreoffice_runtime.py \
            --version "$LIBREOFFICE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --output dist/office-runtime \
            --signing-key "$RUNNER_TEMP/keys/office.private.pem" \
            --key-id "$KEY_ID" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"

      - name: Verify install and conversion
        run: |
          uv run python scripts/verify_office_runtime.py \
            --manifest "dist/office-runtime/libreoffice-$LIBREOFFICE_VERSION-${{ matrix.platform }}.json" \
            --archive "dist/office-runtime/libreoffice-$LIBREOFFICE_VERSION-${{ matrix.platform }}.tar.gz" \
            --public-key "$RUNNER_TEMP/keys/office.public.pem" \
            --key-id "$KEY_ID"

      - name: Upload runtime
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: office-runtime-${{ matrix.platform }}
          path: dist/office-runtime/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download runtimes
        uses: actions/download-artifact@v5
        with:
          pattern: office-runtime-*
          path: release-assets
          merge-multiple: true

      - name: Merge manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          merged = {}
          for path in sorted(Path("release-assets").glob("libreoffice-*.json")):
              merged.update(json.loads(path.read_text()))
          Path("release-assets/office-runtime-manifest.json").write_text(json.dumps(merged, indent=2) + "\n")
          print(json.dumps(merged, indent=2))
          PY
          {
            echo "### Pin these assets in app/services/office_runtime/manifest.py"
            echo '```json'
            cat release-assets/office-runtime-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Office runtime (LibreOffice $LIBREOFFICE_VERSION)" \
              --notes "Trimmed LibreOffice $LIBREOFFICE_VERSION for the EvoFlux document viewer, built from official The Document Foundation packages. LibreOffice is licensed under MPL-2.0; source: https://www.libreoffice.org/download/source-code/" \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
